<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title description">
  <title id="title">The Soul Exchange</title>
  <desc id="description">A floating violet ritual light with runes, sparkles, and wandering soul orbs.</desc>
  <defs>
    <radialGradient id="aura"><stop offset="0" stop-color="#f5f3ff" stop-opacity=".86"/><stop offset=".28" stop-color="#d8b4fe" stop-opacity=".58"/><stop offset=".68" stop-color="#8b5cf6" stop-opacity=".2"/><stop offset="1" stop-color="#3b0764" stop-opacity="0"/></radialGradient>
    <radialGradient id="floor"><stop offset="0" stop-color="#c4b5fd" stop-opacity=".5"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".18"/><stop offset="1" stop-color="#3b0764" stop-opacity="0"/></radialGradient>
    <linearGradient id="energy" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#8b5cf6"/><stop offset=".52" stop-color="#f5d0fe"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .exchange-aura{transform-origin:210px 300px;animation:portal-breathe 3.6s ease-in-out infinite}.rune{transform-origin:210px 408px;animation:rune-drift 10s linear infinite}.soul-mote{transform-box:fill-box;transform-origin:center;animation:soul-rise 3.8s ease-in-out infinite}.soul-mote:nth-child(2n){animation-duration:4.7s}.soul-mote:nth-child(3n){animation-delay:-2.1s}.spark{animation:twinkle 2.4s ease-in-out infinite}.spark:nth-child(2n){animation-delay:-1.2s}
    @keyframes portal-breathe{0%,100%{opacity:.72;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}@keyframes rune-drift{to{transform:rotate(360deg)}}@keyframes soul-rise{0%{opacity:0;transform:translateY(24px) scale(.5)}30%{opacity:.9}100%{opacity:0;transform:translateY(-92px) scale(1.15)}}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
    @media (prefers-reduced-motion:reduce){.exchange-aura,.rune,.soul-mote,.spark{animation:none}.exchange-aura{opacity:.9}.soul-mote,.spark{opacity:.7}}
  </style>
  <path d="M38 440c60-42 284-42 344 0-67 51-277 51-344 0z" fill="url(#floor)"/>
  <g class="rune" fill="none" stroke="url(#energy)" stroke-linecap="round" opacity=".7" filter="url(#glow)">
    <path d="M91 405c22-54 216-54 238 0" stroke-width="3"/><path d="M105 441c45 31 165 31 210 0" stroke-width="2"/>
    <path d="M116 399l9 13-15 6m184-19l-9 13 15 6M166 456l8-15 9 13m71 2l-8-15-9 13" stroke-width="4"/>
  </g>
  <g class="exchange-aura">
    <circle cx="210" cy="292" r="142" fill="url(#aura)"/>
    <path d="M143 354c17-22 28-51 29-88 1-44 18-83 38-110 20 27 37 66 38 110 1 37 12 66 29 88-29-15-51-14-67 5-16-19-38-20-67-5z" fill="url(#aura)" opacity=".72" filter="url(#glow)"/>
    <circle cx="210" cy="310" r="22" fill="#f5f3ff" opacity=".82" filter="url(#glow)"/>
  </g>
  <g aria-hidden="true">
    <circle class="soul-mote" cx="88" cy="376" r="7" fill="#d8b4fe"/><circle class="soul-mote" cx="132" cy="421" r="5" fill="#f5d0fe"/><circle class="soul-mote" cx="174" cy="392" r="4" fill="#ede9fe"/><circle class="soul-mote" cx="245" cy="424" r="6" fill="#c4b5fd"/><circle class="soul-mote" cx="288" cy="389" r="4" fill="#fff"/><circle class="soul-mote" cx="337" cy="426" r="7" fill="#a78bfa"/>
    <path class="spark" d="M92 230l5 11 11 5-11 5-5 11-5-11-11-5 11-5z" fill="#fff"/><path class="spark" d="M320 273l6 13 13 6-13 6-6 13-6-13-13-6 13-6z" fill="#f5d0fe"/><path class="spark" d="M272 154l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ddd6fe"/><path class="spark" d="M151 126l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#fff"/>
  </g>
</svg>
