<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title description">
  <title id="title">The Soul Exchange</title>
  <desc id="description">Transparent violet soul wisps and star-like sparks drifting above the Haunted Woods exchange circle.</desc>
  <defs>
    <linearGradient id="soul-core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".08"/>
      <stop offset=".34" stop-color="#a855f7" stop-opacity=".42"/>
      <stop offset=".7" stop-color="#d8b4fe" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="soul-edge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#581c87" stop-opacity="0"/>
      <stop offset=".48" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f5d0fe" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="spectral-mist" cx="50%" cy="55%" r="58%">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#7c3aed" stop-opacity=".1"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <filter id="mist-blur" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="wisp-glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .18  0 1 0 0 .02  0 0 1 0 .38  0 0 0 1 0" result="violetBlur"/>
      <feMerge>
        <feMergeNode in="violetBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="spark-glow" x="-160%" y="-160%" width="420%" height="420%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.4" result="sparkBlur"/>
      <feMerge>
        <feMergeNode in="sparkBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .spectral-veil{transform-box:fill-box;transform-origin:center;animation:veil-breathe 4.6s ease-in-out infinite}
    .soul-wisp{transform-box:fill-box;transform-origin:center bottom;animation:wisp-float 5.2s ease-in-out infinite}
    .soul-wisp:nth-of-type(2n){animation-delay:-1.4s;animation-duration:6.1s}
    .soul-wisp:nth-of-type(3n){animation-delay:-2.8s;animation-duration:4.7s}
    .soul-wisp:nth-of-type(5n){animation-delay:-.8s;animation-duration:5.8s}
    .soul-spark{transform-box:fill-box;transform-origin:center;animation:sparkle-twinkle 2.7s ease-in-out infinite}
    .soul-spark:nth-of-type(2n){animation-delay:-.9s;animation-duration:3.4s}
    .soul-spark:nth-of-type(3n){animation-delay:-1.7s;animation-duration:2.2s}
    .soul-spark:nth-of-type(5n){animation-delay:-2.3s;animation-duration:4s}
    @keyframes veil-breathe{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.7;transform:scale(1.04)}}
    @keyframes wisp-float{0%,100%{opacity:.5;transform:translateY(7px) scale(.95) rotate(-1deg)}45%{opacity:.96;transform:translateY(-10px) scale(1.04) rotate(1deg)}70%{opacity:.72;transform:translateY(-3px) scale(1)}}
    @keyframes sparkle-twinkle{0%,100%{opacity:.12;transform:scale(.45) rotate(0deg)}44%{opacity:1;transform:scale(1.18) rotate(18deg)}62%{opacity:.55;transform:scale(.82) rotate(30deg)}}
    @media (prefers-reduced-motion:reduce){.spectral-veil,.soul-wisp,.soul-spark{animation:none!important}.spectral-veil{opacity:.52}.soul-wisp{opacity:.82}.soul-spark{opacity:.72}}
  </style>

  <g aria-hidden="true" class="spectral-veil" filter="url(#mist-blur)">
    <path d="M92 354 C71 312 91 250 135 221 C168 200 178 160 211 149 C249 136 273 173 292 205 C312 239 357 269 346 319 C335 367 285 389 239 395 C184 402 116 392 92 354 Z" fill="url(#spectral-mist)"/>
    <path d="M128 307 C111 276 128 236 162 219 C190 205 197 181 222 178 C250 175 267 202 279 226 C293 253 317 271 309 301 C301 332 268 346 232 350 C190 354 146 340 128 307 Z" fill="#a855f7" opacity=".08"/>
  </g>

  <g filter="url(#wisp-glow)" aria-hidden="true">
    <path class="soul-wisp" d="M210 347 C184 319 187 289 203 267 C219 245 218 223 207 201 C232 214 247 236 241 260 C237 279 221 294 226 314 C231 332 220 343 210 347 Z" fill="url(#soul-core)"/>
    <path class="soul-wisp" d="M138 306 C121 287 124 267 135 251 C146 236 145 220 137 206 C155 215 166 231 162 248 C158 261 147 273 151 286 C154 298 146 304 138 306 Z" fill="url(#soul-edge)" opacity=".88"/>
    <path class="soul-wisp" d="M296 304 C279 285 282 264 293 250 C304 235 303 220 296 207 C314 215 324 230 320 246 C317 259 307 271 310 284 C313 295 304 301 296 304 Z" fill="url(#soul-core)" opacity=".8"/>
    <path class="soul-wisp" d="M170 221 C157 207 159 192 167 181 C176 169 175 158 169 147 C183 153 191 165 188 178 C186 188 177 197 180 207 C182 216 176 220 170 221 Z" fill="url(#soul-edge)" opacity=".72"/>
    <path class="soul-wisp" d="M260 210 C248 197 250 183 257 172 C265 161 264 151 259 142 C272 148 279 158 276 170 C274 179 267 188 269 197 C271 205 265 209 260 210 Z" fill="url(#soul-core)" opacity=".69"/>
    <path class="soul-wisp" d="M106 364 C95 352 97 338 104 329 C111 319 110 309 105 301 C117 306 124 316 121 327 C119 336 112 343 114 351 C116 359 111 363 106 364 Z" fill="url(#soul-edge)" opacity=".6"/>
    <path class="soul-wisp" d="M326 363 C314 350 316 336 324 325 C332 315 331 304 325 294 C338 300 346 311 343 323 C340 333 333 341 335 350 C337 358 331 362 326 363 Z" fill="url(#soul-core)" opacity=".64"/>
  </g>

  <g fill="#f5d0fe" filter="url(#spark-glow)" aria-hidden="true">
    <path class="soul-spark" d="M211 126 L215 137 L226 141 L215 145 L211 157 L207 145 L196 141 L207 137 Z"/>
    <path class="soul-spark" d="M101 225 L104 233 L112 236 L104 239 L101 247 L98 239 L90 236 L98 233 Z" opacity=".82"/>
    <path class="soul-spark" d="M318 223 L321 232 L330 235 L321 238 L318 247 L315 238 L306 235 L315 232 Z" opacity=".85"/>
    <path class="soul-spark" d="M150 154 L153 162 L161 165 L153 168 L150 176 L147 168 L139 165 L147 162 Z" opacity=".76"/>
    <path class="soul-spark" d="M280 167 L283 174 L290 177 L283 180 L280 188 L277 180 L270 177 L277 174 Z" opacity=".72"/>
    <path class="soul-spark" d="M86 314 L89 321 L96 324 L89 327 L86 334 L83 327 L76 324 L83 321 Z" opacity=".62"/>
    <path class="soul-spark" d="M349 318 L352 326 L360 329 L352 332 L349 340 L346 332 L338 329 L346 326 Z" opacity=".65"/>
    <path class="soul-spark" d="M132 389 L135 396 L142 399 L135 402 L132 409 L129 402 L122 399 L129 396 Z" opacity=".58"/>
    <path class="soul-spark" d="M285 401 L288 408 L295 411 L288 414 L285 421 L282 414 L275 411 L282 408 Z" opacity=".55"/>
    <path class="soul-spark" d="M234 102 L236 108 L242 110 L236 112 L234 118 L232 112 L226 110 L232 108 Z" opacity=".6"/>
    <path class="soul-spark" d="M65 248 L67 254 L73 256 L67 258 L65 264 L63 258 L57 256 L63 254 Z" opacity=".54"/>
    <path class="soul-spark" d="M367 265 L369 271 L375 273 L369 275 L367 281 L365 275 L359 273 L365 271 Z" opacity=".56"/>
    <path class="soul-spark" d="M183 384 L185 390 L191 392 L185 394 L183 400 L181 394 L175 392 L181 390 Z" opacity=".5"/>
    <path class="soul-spark" d="M247 351 L249 357 L255 359 L249 361 L247 367 L245 361 L239 359 L245 357 Z" opacity=".58"/>
  </g>
</svg>
