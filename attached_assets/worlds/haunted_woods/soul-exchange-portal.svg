<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title description">
  <title id="title">The Soul Exchange</title>
  <desc id="description">A violet magical threshold with small rising lights and star-shaped sparks, matching the Elysian Clearing portal style.</desc>
  <defs>
    <radialGradient id="threshold-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".18" stop-color="#e9d5ff" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#a855f7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="threshold-rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset=".28" stop-color="#c084fc" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#f5d0fe" stop-opacity=".76"/>
      <stop offset=".72" stop-color="#c084fc" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="threshold-blur" x="-50%" y="-150%" width="200%" height="400%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="mote-glow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="star-glow" x="-220%" y="-220%" width="540%" height="540%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .threshold-aura{transform-box:fill-box;transform-origin:center;animation:threshold-breathe 3.8s ease-in-out infinite}
    .portal-mote{transform-box:fill-box;transform-origin:center;animation:portal-rise 3.4s ease-in-out infinite}
    .portal-mote:nth-of-type(2n){animation-delay:-.8s;animation-duration:3.8s}
    .portal-mote:nth-of-type(3n){animation-delay:-1.55s;animation-duration:3.1s}
    .portal-mote:nth-of-type(5n){animation-delay:-2.2s;animation-duration:4.15s}
    .portal-star{transform-box:fill-box;transform-origin:center;animation:portal-twinkle 3s ease-in-out infinite}
    .portal-star:nth-of-type(2n){animation-delay:-1.1s;animation-duration:3.55s}
    .portal-star:nth-of-type(3n){animation-delay:-2.05s;animation-duration:2.65s}
    @keyframes threshold-breathe{0%,100%{opacity:.48;transform:scale(.94)}50%{opacity:.92;transform:scale(1.04)}}
    @keyframes portal-rise{0%{opacity:0;transform:translateY(8px) scale(.55)}26%{opacity:.96}72%{opacity:.58}100%{opacity:0;transform:translateY(-74px) scale(1.02)}}
    @keyframes portal-twinkle{0%,18%,100%{opacity:.1;transform:translateY(2px) scale(.42) rotate(0deg)}44%{opacity:1;transform:translateY(-34px) scale(1.18) rotate(18deg)}76%{opacity:.3;transform:translateY(-72px) scale(.68) rotate(36deg)}}
    @media (prefers-reduced-motion:reduce){.threshold-aura,.portal-mote,.portal-star{animation:none!important}.threshold-aura{opacity:.72}.portal-mote{opacity:.72}.portal-star{opacity:.82}}
  </style>

  <g aria-hidden="true" class="threshold-aura">
    <path d="M69 407 C104 365 316 365 351 407 C319 451 101 451 69 407 Z" fill="url(#threshold-core)" filter="url(#threshold-blur)" opacity=".72"/>
    <path d="M83 408 C122 382 298 382 337 408 C298 433 122 433 83 408 Z" fill="none" stroke="url(#threshold-rim)" stroke-width="5" opacity=".6"/>
    <path d="M119 409 C147 392 273 392 301 409 C273 426 147 426 119 409 Z" fill="none" stroke="#d8b4fe" stroke-width="2" opacity=".32"/>
  </g>

  <g fill="#d8b4fe" filter="url(#mote-glow)" aria-hidden="true">
    <path class="portal-mote" d="M86 390 L91 395 L86 400 L81 395 Z"/>
    <path class="portal-mote" d="M112 366 L116 370 L112 374 L108 370 Z" opacity=".82"/>
    <path class="portal-mote" d="M137 403 L142 408 L137 413 L132 408 Z" opacity=".88"/>
    <path class="portal-mote" d="M160 375 L164 379 L160 383 L156 379 Z" opacity=".78"/>
    <path class="portal-mote" d="M185 398 L190 403 L185 408 L180 403 Z"/>
    <path class="portal-mote" d="M207 360 L211 364 L207 368 L203 364 Z" opacity=".8"/>
    <path class="portal-mote" d="M230 400 L235 405 L230 410 L225 405 Z" opacity=".9"/>
    <path class="portal-mote" d="M253 371 L257 375 L253 379 L249 375 Z" opacity=".78"/>
    <path class="portal-mote" d="M278 397 L283 402 L278 407 L273 402 Z"/>
    <path class="portal-mote" d="M305 365 L309 369 L305 373 L301 369 Z" opacity=".84"/>
    <path class="portal-mote" d="M330 391 L335 396 L330 401 L325 396 Z" opacity=".9"/>
    <path class="portal-mote" d="M101 423 L105 427 L101 431 L97 427 Z" opacity=".68"/>
    <path class="portal-mote" d="M150 430 L154 434 L150 438 L146 434 Z" opacity=".66"/>
    <path class="portal-mote" d="M198 421 L202 425 L198 429 L194 425 Z" opacity=".7"/>
    <path class="portal-mote" d="M247 430 L251 434 L247 438 L243 434 Z" opacity=".66"/>
    <path class="portal-mote" d="M296 421 L300 425 L296 429 L292 425 Z" opacity=".7"/>
    <path class="portal-mote" d="M126 339 L130 343 L126 347 L122 343 Z" opacity=".62"/>
    <path class="portal-mote" d="M176 329 L180 333 L176 337 L172 333 Z" opacity=".68"/>
    <path class="portal-mote" d="M228 336 L232 340 L228 344 L224 340 Z" opacity=".64"/>
    <path class="portal-mote" d="M286 332 L290 336 L286 340 L282 336 Z" opacity=".66"/>
  </g>

  <g fill="#f5d0fe" filter="url(#star-glow)" aria-hidden="true">
    <path class="portal-star" d="M119 347 L123 357 L133 361 L123 365 L119 375 L115 365 L105 361 L115 357 Z"/>
    <path class="portal-star" d="M173 388 L176 396 L184 399 L176 402 L173 410 L170 402 L162 399 L170 396 Z" opacity=".82"/>
    <path class="portal-star" d="M214 320 L218 330 L228 334 L218 338 L214 348 L210 338 L200 334 L210 330 Z" opacity=".92"/>
    <path class="portal-star" d="M263 385 L266 393 L274 396 L266 399 L263 407 L260 399 L252 396 L260 393 Z" opacity=".8"/>
    <path class="portal-star" d="M308 346 L312 356 L322 360 L312 364 L308 374 L304 364 L294 360 L304 356 Z" opacity=".88"/>
    <path class="portal-star" d="M150 303 L153 311 L161 314 L153 317 L150 325 L147 317 L139 314 L147 311 Z" opacity=".72"/>
    <path class="portal-star" d="M270 297 L273 305 L281 308 L273 311 L270 319 L267 311 L259 308 L267 305 Z" opacity=".72"/>
    <path class="portal-star" d="M196 274 L199 281 L206 284 L199 287 L196 294 L193 287 L186 284 L193 281 Z" opacity=".62"/>
  </g>
</svg>