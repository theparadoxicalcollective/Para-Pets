<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title description">
  <title id="title">The Soul Exchange</title>
  <desc id="description">A loose cluster of differently sized violet soul orbs glowing in the Haunted Woods.</desc>
  <defs>
    <radialGradient id="orb" cx="38%" cy="32%" r="68%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset=".18" stop-color="#f5d0fe" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#c084fc" stop-opacity=".88"/>
      <stop offset=".78" stop-color="#8b5cf6" stop-opacity=".7"/>
      <stop offset="1" stop-color="#581c87" stop-opacity=".18"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity=".52"/>
      <stop offset=".42" stop-color="#a855f7" stop-opacity=".24"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="core-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .soul-orb{transform-box:fill-box;transform-origin:center;animation:orb-drift 4.8s ease-in-out infinite}
    .soul-orb:nth-of-type(2n){animation-delay:-1.3s;animation-duration:5.7s}
    .soul-orb:nth-of-type(3n){animation-delay:-2.6s;animation-duration:4.2s}
    .soul-orb:nth-of-type(5n){animation-delay:-.7s;animation-duration:6.1s}
    .orb-halo{animation:halo-breathe 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes orb-drift{0%,100%{transform:translateY(5px) scale(.94);opacity:.72}50%{transform:translateY(-8px) scale(1.06);opacity:1}}
    @keyframes halo-breathe{0%,100%{opacity:.42;transform:scale(.9)}50%{opacity:.76;transform:scale(1.12)}}
    @media (prefers-reduced-motion:reduce){.soul-orb,.orb-halo{animation:none!important}.soul-orb{opacity:.9}.orb-halo{opacity:.55}}
  </style>

  <g aria-hidden="true">
    <circle class="orb-halo" cx="211" cy="285" r="92" fill="url(#halo)" filter="url(#soft-glow)"/>
    <circle class="orb-halo" cx="128" cy="240" r="54" fill="url(#halo)" filter="url(#soft-glow)" opacity=".68"/>
    <circle class="orb-halo" cx="304" cy="247" r="47" fill="url(#halo)" filter="url(#soft-glow)" opacity=".6"/>
  </g>

  <g filter="url(#core-glow)">
    <circle class="soul-orb" cx="210" cy="286" r="44" fill="url(#orb)"/>
    <circle class="soul-orb" cx="126" cy="239" r="27" fill="url(#orb)" opacity=".94"/>
    <circle class="soul-orb" cx="302" cy="246" r="23" fill="url(#orb)" opacity=".9"/>
    <circle class="soul-orb" cx="163" cy="174" r="17" fill="url(#orb)" opacity=".86"/>
    <circle class="soul-orb" cx="264" cy="164" r="13" fill="url(#orb)" opacity=".8"/>
    <circle class="soul-orb" cx="91" cy="316" r="12" fill="url(#orb)" opacity=".78"/>
    <circle class="soul-orb" cx="329" cy="328" r="16" fill="url(#orb)" opacity=".84"/>
    <circle class="soul-orb" cx="152" cy="373" r="10" fill="url(#orb)" opacity=".72"/>
    <circle class="soul-orb" cx="273" cy="389" r="8" fill="url(#orb)" opacity=".7"/>
    <circle class="soul-orb" cx="214" cy="126" r="7" fill="url(#orb)" opacity=".68"/>
    <circle class="soul-orb" cx="76" cy="211" r="6" fill="url(#orb)" opacity=".64"/>
    <circle class="soul-orb" cx="350" cy="201" r="7" fill="url(#orb)" opacity=".66"/>
  </g>
</svg>
