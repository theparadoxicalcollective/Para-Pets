<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title description">
  <title id="title">The Soul Exchange portal</title>
  <desc id="description">A violet magical portal surrounded by softly rising soul lights.</desc>
  <defs>
    <radialGradient id="groundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".48"/>
      <stop offset=".42" stop-color="#8b5cf6" stop-opacity=".23"/>
      <stop offset="1" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portalCore" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#f5f3ff" stop-opacity=".92"/>
      <stop offset=".26" stop-color="#d8b4fe" stop-opacity=".78"/>
      <stop offset=".62" stop-color="#7c3aed" stop-opacity=".38"/>
      <stop offset="1" stop-color="#2e1065" stop-opacity=".02"/>
    </radialGradient>
    <linearGradient id="portalRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset=".22" stop-color="#c4b5fd"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset=".82" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f5d0fe"/>
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-25%" width="170%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="rimGlow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .portal-breathe{transform-origin:210px 270px;animation:portal-breathe 3.6s ease-in-out infinite}
    .portal-shimmer{animation:portal-shimmer 2.8s ease-in-out infinite}
    .soul-mote{transform-box:fill-box;transform-origin:center;animation:soul-rise 3.4s ease-in-out infinite}
    .soul-mote:nth-of-type(2n){animation-duration:4.1s}
    .soul-mote:nth-of-type(3n){animation-duration:3.8s}
    @keyframes portal-breathe{0%,100%{transform:scale(.985);opacity:.82}50%{transform:scale(1.018);opacity:1}}
    @keyframes portal-shimmer{0%,100%{opacity:.42}50%{opacity:.86}}
    @keyframes soul-rise{0%{opacity:0;transform:translateY(18px) scale(.55)}28%{opacity:.9}78%{opacity:.42}100%{opacity:0;transform:translateY(-58px) scale(1.08)}}
    @media (prefers-reduced-motion:reduce){.portal-breathe,.portal-shimmer,.soul-mote{animation:none}.portal-breathe{opacity:.94}.portal-shimmer{opacity:.62}.soul-mote{opacity:.58}}
  </style>

  <ellipse cx="210" cy="454" rx="160" ry="42" fill="url(#groundGlow)"/>
  <ellipse cx="210" cy="270" rx="122" ry="188" fill="#8b5cf6" opacity=".18" filter="url(#softGlow)"/>

  <g class="portal-breathe">
    <ellipse cx="210" cy="270" rx="104" ry="166" fill="url(#portalCore)"/>
    <ellipse cx="210" cy="270" rx="112" ry="176" fill="none" stroke="#6d28d9" stroke-opacity=".32" stroke-width="20" filter="url(#softGlow)"/>
    <ellipse cx="210" cy="270" rx="110" ry="174" fill="none" stroke="url(#portalRim)" stroke-width="10" filter="url(#rimGlow)"/>
    <path d="M137 405c26 18 120 18 146 0" fill="none" stroke="#d8b4fe" stroke-opacity=".72" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g aria-hidden="true">
    <circle class="soul-mote" cx="64" cy="286" r="3" fill="#f5f3ff" style="animation-delay:-1.4s"/>
    <circle class="soul-mote" cx="350" cy="238" r="4" fill="#d8b4fe" style="animation-delay:-2.7s"/>
    <circle class="soul-mote" cx="126" cy="190" r="2.5" fill="#c4b5fd" style="animation-delay:-.7s"/>
    <circle class="soul-mote" cx="292" cy="148" r="3.5" fill="#f5d0fe" style="animation-delay:-3.3s"/>
    <circle class="soul-mote" cx="82" cy="405" r="5" fill="#ddd6fe" style="animation-delay:-.4s"/>
    <circle class="soul-mote" cx="112" cy="445" r="3.5" fill="#a78bfa" style="animation-delay:-1.7s"/>
    <circle class="soul-mote" cx="142" cy="420" r="4" fill="#f5d0fe" style="animation-delay:-2.5s"/>
    <circle class="soul-mote" cx="176" cy="458" r="5.5" fill="#c4b5fd" style="animation-delay:-.9s"/>
    <circle class="soul-mote" cx="211" cy="426" r="3" fill="#f5f3ff" style="animation-delay:-2.9s"/>
    <circle class="soul-mote" cx="244" cy="452" r="4.5" fill="#d8b4fe" style="animation-delay:-1.2s"/>
    <circle class="soul-mote" cx="276" cy="417" r="5" fill="#a78bfa" style="animation-delay:-3.1s"/>
    <circle class="soul-mote" cx="310" cy="446" r="3.5" fill="#ede9fe" style="animation-delay:-2.1s"/>
    <circle class="soul-mote" cx="338" cy="402" r="4.5" fill="#c084fc" style="animation-delay:-.2s"/>
    <path class="soul-mote" d="M103 348l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#f5f3ff" style="animation-delay:-2.4s"/>
    <path class="soul-mote" d="M315 337l4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#e9d5ff" style="animation-delay:-1.1s"/>
    <path class="soul-mote" d="M210 388l3 6 6 3-6 3-3 6-3-6-6-3 6-3z" fill="#ffffff" style="animation-delay:-3s"/>
  </g>
</svg>
