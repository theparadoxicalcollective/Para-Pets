name: Apply Clearing action visual polish

on:
  push:
    branches:
      - fix/clearing-action-visual-polish
    paths:
      - .github/workflows/apply-clearing-action-visual-polish.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clearing-action-visual-polish
          fetch-depth: 0

      - name: Apply scoped Clearing changes
        run: node .github/scripts/apply-clearing-action-visual-polish.cjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Focused Clearing tests
        run: npx tsx --test test/elysianClearingActionVisualPolish.test.ts test/elysianClearingControls.test.ts test/elysianClearingRegressions.test.ts test/elysianClearingTargetLock.test.ts

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit tested Clearing polish
        shell: bash
        run: |
          rm .github/workflows/apply-clearing-action-visual-polish.yml
          rm .github/scripts/apply-clearing-action-visual-polish.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/ElysianClearingCombat.tsx client/src/components/ClearingAttackEffect.tsx client/src/components/WalkAroundScene.tsx test/elysianClearingActionVisualPolish.test.ts .github/workflows/apply-clearing-action-visual-polish.yml .github/scripts/apply-clearing-action-visual-polish.cjs
          git commit -m "Polish Elysian Clearing action visuals"
          git push origin HEAD:fix/clearing-action-visual-polish
