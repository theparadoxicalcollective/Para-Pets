name: Apply Clearing action visual polish

on:
  push:
    branches:
      - fix/clearing-action-visual-polish
    paths:
      - .github/workflows/apply-clearing-action-visual-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clearing-action-visual-polish
          fetch-depth: 0

      - name: Apply patch and publish result
        shell: bash
        run: |
          set +e
          node .github/scripts/apply-clearing-action-visual-polish.cjs > /tmp/clearing-patch.log 2>&1
          patch_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$patch_status" -ne 0 ]; then
            cp /tmp/clearing-patch.log clearing-patch-failure.log
            git add clearing-patch-failure.log
            git commit -m "Record Clearing patch failure"
            git push origin HEAD:fix/clearing-action-visual-polish
            exit "$patch_status"
          fi

          rm .github/workflows/apply-clearing-action-visual-polish.yml
          rm .github/scripts/apply-clearing-action-visual-polish.cjs
          rm -f clearing-patch-failure.log
          git add client/src/components/ElysianClearingCombat.tsx client/src/components/ClearingAttackEffect.tsx client/src/components/WalkAroundScene.tsx test/elysianClearingActionVisualPolish.test.ts .github/workflows/apply-clearing-action-visual-polish.yml .github/scripts/apply-clearing-action-visual-polish.cjs clearing-patch-failure.log
          git commit -m "Polish Elysian Clearing action visuals"
          git push origin HEAD:fix/clearing-action-visual-polish
