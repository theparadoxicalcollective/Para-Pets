name: Apply scoped Pet Care repair

on:
  push:
    branches:
      - fix/pet-care-idle-petting-hunger
    paths:
      - .github/workflows/apply-pet-care-repair.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pet-care-idle-petting-hunger
          fetch-depth: 0

      - name: Apply narrowly scoped Pet Care changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const pagePath = 'client/src/pages/PetHousePage.tsx';
          const cssPath = 'client/src/index.css';
          const interactionsTestPath = 'test/petCareInteractions.test.ts';
          const renderingTestPath = 'test/petCareRenderingRegression.test.ts';

          let page = fs.readFileSync(pagePath, 'utf8');
          let css = fs.readFileSync(cssPath, 'utf8');
          let interactions = fs.readFileSync(interactionsTestPath, 'utf8');
          let rendering = fs.readFileSync(renderingTestPath, 'utf8');

          function replaceOnce(text, before, after, label) {
            const first = text.indexOf(before);
            if (first < 0) throw new Error(`Missing expected source for ${label}`);
            if (text.indexOf(before, first + before.length) >= 0) throw new Error(`Expected one source match for ${label}`);
            return text.slice(0, first) + after + text.slice(first + before.length);
          }

          function replaceRegexOnce(text, pattern, after, label) {
            const matches = [...text.matchAll(new RegExp(pattern.source, pattern.flags.includes('g') ? pattern.flags : pattern.flags + 'g'))];
            if (matches.length !== 1) throw new Error(`Expected one regex match for ${label}; found ${matches.length}`);
            return text.replace(pattern, after);
          }

          page = replaceOnce(
            page,
            `  const petHealth = Number(livePet?.petHealth);\n  const maxHunger = Number.isFinite(petHealth) && petHealth > 0 ? petHealth : 1000;`,
            `  // Hunger is a fixed 0–1000 care stat on the server; combat HP is unrelated.\n  const maxHunger = 1000;`,
            'fixed hunger maximum',
          );

          page = replaceOnce(
            page,
            `      playPlop();\n      qc.invalidateQueries({ queryKey: [\"/api/inventory\"] });\n      if (data?.rewarded && data?.amount > 0) {`,
            `      playPlop();\n      // Reflect the mood gain immediately while the authoritative refetch runs.\n      if (data?.moodGained > 0 && pet?.inventoryId) {\n        qc.setQueryData([\"/api/inventory\"], (payload: unknown) => {\n          if (!Array.isArray(payload)) return payload;\n          return payload.map((entry: any) => {\n            if (entry?.id !== pet.inventoryId) return entry;\n            const currentMood = Number(entry.petMood);\n            const baseMood = Number.isFinite(currentMood) ? currentMood : 100;\n            return { ...entry, petMood: Math.min(100, baseMood + Number(data.moodGained)) };\n          });\n        });\n      }\n      void qc.invalidateQueries({ queryKey: [\"/api/inventory\"] });\n      if (data?.rewarded && data?.amount > 0) {`,
            'immediate petting mood update',
          );

          page = replaceRegexOnce(
            page,
            /  const triggerCircleEffects = useCallback\(\(\) => \{[\s\S]*?\n  \}, \[burstHearts, burstSparkles\]\);/,
            `  const triggerCircleEffects = useCallback(() => {\n    setPetCircling(true);\n    const g = petGestureRef.current;\n    if (!g) return;\n    // Keep petting and rewards enabled on iOS while avoiding the repeating\n    // particle timers that originally made the low-memory mode expensive.\n    if (!safeMode) {\n      if (g.heartTimer == null) {\n        const tick = () => {\n          const cur = petGestureRef.current;\n          if (!cur) return;\n          burstHearts(cur.cx, cur.cy + 30, 2);\n        };\n        tick();\n        g.heartTimer = window.setInterval(tick, 380);\n      }\n      if (g.sparkleTimer == null) {\n        const sparkleTick = () => {\n          const cur = petGestureRef.current;\n          if (!cur) return;\n          const ringAngle = Math.random() * Math.PI * 2;\n          const ringR = 60 + Math.random() * 40;\n          burstSparkles(cur.cx + Math.cos(ringAngle) * ringR, cur.cy + Math.sin(ringAngle) * ringR, 6);\n        };\n        sparkleTick();\n        g.sparkleTimer = window.setInterval(sparkleTick, 180);\n      }\n    }\n    if (g.circleResetTimer != null) window.clearTimeout(g.circleResetTimer);\n    g.circleResetTimer = scheduleTimeout(() => {\n      const cur = petGestureRef.current;\n      if (cur?.heartTimer != null) {\n        window.clearInterval(cur.heartTimer);\n        cur.heartTimer = null;\n      }\n      if (cur?.sparkleTimer != null) {\n        window.clearInterval(cur.sparkleTimer);\n        cur.sparkleTimer = null;\n      }\n      setPetCircling(false);\n    }, 350);\n  }, [burstHearts, burstSparkles, safeMode, scheduleTimeout]);`,
            'safe-mode petting effects',
          );

          page = replaceOnce(
            page,
            `        onPointerDown={safeMode ? undefined : onPetPointerDown}\n        onPointerMove={safeMode ? undefined : onPetPointerMove}\n        onPointerUp={safeMode ? undefined : endPetGesture}\n        onPointerCancel={safeMode ? undefined : endPetGesture}`,
            `        onPointerDown={onPetPointerDown}\n        onPointerMove={onPetPointerMove}\n        onPointerUp={endPetGesture}\n        onPointerCancel={endPetGesture}`,
            'petting pointer handlers',
          );

          page = replaceRegexOnce(
            page,
            /          \{safeMode && \(pet\.hatchedImageUrl \|\| pet\.imageUrl\) \? \([\s\S]*?          \) : null\}/,
            `          {pet.petTemplateId ? (\n            <PetAnimator\n              petTemplateId={pet.petTemplateId}\n              mode=\"idle\"\n              view=\"front\"\n              size={300}\n              fillContainer\n              performanceStatic={safeMode}\n              expression={petBounce ? \"happy\" : (petPressed || petCircling) ? \"petted\" : \"neutral\"}\n            />\n          ) : (pet.hatchedImageUrl || pet.imageUrl) ? (\n            <img\n              src={pet.hatchedImageUrl ?? pet.imageUrl ?? \"\"}\n              alt={pet.nickname ?? pet.name}\n              draggable={false}\n              style={{ width: \"100%\", height: \"100%\", objectFit: \"contain\", pointerEvents: \"none\" }}\n            />\n          ) : null}`,
            'idle PetAnimator rendering',
          );

          page = replaceRegexOnce(
            page,
            /  const feedMutation = useMutation\(\{[\s\S]*?\n  \}\);\n\n  const updateDragGhostPosition/,
            `  const feedMutation = useMutation({\n    mutationFn: async ({ itemInventoryId, quantity = 1 }: { itemInventoryId: string; quantity?: number }) => {\n      const res = await apiRequest(\"POST\", \`/api/pet/\${pet.inventoryId}/feed-edible\`, { itemInventoryId, quantity });\n      return await res.json();\n    },\n    onSuccess: (data: any, variables) => {\n      recordPhase(\"mutation-success-received\");\n      setSelectedCareItem(null);\n      playPlop();\n      // The feed endpoint returns the updated pet. Merge it into the inventory\n      // cache immediately so Hunger and Mood move before the refetch completes.\n      if (data && typeof data === \"object\" && pet?.inventoryId) {\n        qc.setQueryData([\"/api/inventory\"], (payload: unknown) => {\n          if (!Array.isArray(payload)) return payload;\n          return payload.map((entry: any) =>\n            entry?.id === pet.inventoryId ? { ...entry, ...data } : entry\n          );\n        });\n      }\n      void qc.invalidateQueries({ queryKey: [\"/api/inventory\"] });\n      void qc.invalidateQueries({ queryKey: [\"/api/quests/daily\"] });\n      recordPhase(\"success-visual-started\");\n      if (!safeMode) {\n        setPetGlow(true);\n        setPetBounce(true);\n        scheduleTimeout(() => setPetGlow(false), 700);\n        scheduleTimeout(() => setPetBounce(false), 1100);\n      }\n      const fed = inventory.find((it) => it.id === variables.itemInventoryId);\n      const qty = variables.quantity ?? 1;\n      const amount = Number(data?.totalFeedPoints) || (fed?.statBoostAmount ?? 5) * qty;\n      const id = ++floatIdRef.current;\n      const box = petBoxRef.current?.getBoundingClientRect();\n      const cx = box ? box.left + box.width / 2 : window.innerWidth / 2;\n      const cy = box ? box.top + box.height * 0.3 : window.innerHeight / 2;\n      setFloatTexts((arr) => [...arr, { id, x: cx, y: cy, text: \`+\${amount} Feed pts\` }]);\n      scheduleTimeout(() => setFloatTexts((arr) => arr.filter((f) => f.id !== id)), 1400);\n      if (box && !safeMode) {\n        const bx = box.left + box.width / 2;\n        const by = box.top + box.height / 2;\n        burstSparkles(bx, by, 14);\n        burstHearts(bx, by + 30, 8);\n      }\n    },\n    onError: (err: any) => {\n      toast({\n        title: \"Couldn't feed\",\n        description: err?.message || \"Try again in a moment.\",\n      });\n    },\n  });\n\n  const updateDragGhostPosition`,
            'feed response and cache update',
          );

          css = replaceOnce(
            css,
            `.pet-care-inventory-section .pet-care-hunger {\n  position: relative;\n  inset: auto;\n  width: min(88%, 430px);\n  margin: 0 auto clamp(16px, 2.5dvh, 24px);\n  padding: 0;\n}`,
            `.pet-care-inventory-section .pet-care-hunger {\n  position: relative;\n  inset: auto;\n  width: min(calc(100% - var(--pet-care-usable-left) - var(--pet-care-scene-right)), 390px);\n  margin: 0 auto clamp(16px, 2.5dvh, 24px);\n  padding: 0;\n  transform: translateX(calc((var(--pet-care-usable-left) - var(--pet-care-scene-right)) / 2));\n}`,
            'responsive hunger meter layout',
          );

          interactions = replaceRegexOnce(
            interactions,
            /test\("safe visual mode leaves lightweight drag and tap-select handlers mounted", \(\) => \{[\s\S]*?\n\}\);/,
            `test(\"safe visual mode keeps idle rendering and petting without heavy particle timers\", () => {\n  const page = readFileSync(\"client/src/pages/PetHousePage.tsx\", \"utf8\");\n  assert.match(page, /onPointerDown=\\{dragEnabled \\?/);\n  assert.match(page, /onPointerMove=\\{dragEnabled \\? onItemPointerMove/);\n  assert.match(page, /\\{dragEnabled && dragGhost && \\(/);\n  assert.match(page, /onClick=\\{\\(\\) => onItemClick\\(item\\)\\}/);\n  assert.match(page, /onPointerDown=\\{onPetPointerDown\\}/);\n  assert.match(page, /onPointerMove=\\{onPetPointerMove\\}/);\n  assert.match(page, /mode=\"idle\"/);\n  assert.match(page, /performanceStatic=\\{safeMode\\}/);\n  assert.match(page, /if \\(!safeMode\\) \\{[\\s\\S]*?g\\.heartTimer/);\n  assert.doesNotMatch(page, /pet-care-safe-static-pet/);\n  assert.doesNotMatch(page, /<VisibleAssetImage[^>]*dragGhost/);\n});`,
            'safe-mode interaction regression test',
          );

          if (!rendering.includes('Pet Care hunger follows the server care-stat scale')) {
            rendering += `\n\ntest(\"Pet Care hunger follows the server care-stat scale and updates from feed responses\", () => {\n  const page = readFileSync(\"client/src/pages/PetHousePage.tsx\", \"utf8\");\n  const css = readFileSync(\"client/src/index.css\", \"utf8\");\n  assert.match(page, /const maxHunger = 1000;/);\n  assert.doesNotMatch(page, /maxHunger = Number\\.isFinite\\(petHealth\\)/);\n  const feed = page.slice(page.indexOf(\"const feedMutation\"), page.indexOf(\"const updateDragGhostPosition\"));\n  assert.match(feed, /return await res\\.json\\(\\)/);\n  assert.match(feed, /qc\\.setQueryData\\(\\[\"\\/api\\/inventory\"\\]/);\n  assert.match(feed, /totalFeedPoints/);\n  assert.match(css, /width: min\\(calc\\(100% - var\\(--pet-care-usable-left\\) - var\\(--pet-care-scene-right\\)\\), 390px\\)/);\n  assert.match(css, /transform: translateX\\(calc\\(\\(var\\(--pet-care-usable-left\\) - var\\(--pet-care-scene-right\\)\\) \\/ 2\\)\\)/);\n});\n`;
          }

          fs.writeFileSync(pagePath, page);
          fs.writeFileSync(cssPath, css);
          fs.writeFileSync(interactionsTestPath, interactions);
          fs.writeFileSync(renderingTestPath, rendering);
          NODE

      - name: Commit scoped repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/PetHousePage.tsx client/src/index.css test/petCareInteractions.test.ts test/petCareRenderingRegression.test.ts
          git commit -m "Restore Pet Care idle, petting, and hunger updates"
          git push origin HEAD:fix/pet-care-idle-petting-hunger
