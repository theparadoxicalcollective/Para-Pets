name: Complete Pet Care extraction PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: pet-care-feature-extraction-pr
  cancel-in-progress: false

jobs:
  extract-and-verify:
    if: github.head_ref == 'refactor/pet-care-feature-module'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: refactor/pet-care-feature-module
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Extract Pet Care feature module
        run: node script/extract-pet-care-feature.cjs

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run regression tests
        run: npm test

      - name: Build production bundles
        run: npm run build

      - name: Record extraction verification
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assetsDir = 'dist/public/assets';
          const files = fs.readdirSync(assetsDir).filter((name) => name.endsWith('.js'));
          const sizeOf = (name) => name ? fs.statSync(path.join(assetsDir, name)).size : null;
          const route = files.find((name) => name.startsWith('PetCarePage-')) ?? null;
          const house = files.find((name) => name.startsWith('PetHousePage-')) ?? null;
          const feature = files.find((name) => {
            const content = fs.readFileSync(path.join(assetsDir, name), 'utf8');
            return content.includes('pet-care-item-shelf') && name !== route && name !== house;
          }) ?? null;
          const format = (name) => name ? `\`${name}\` (${sizeOf(name).toLocaleString()} bytes)` : 'not emitted as a separately named chunk';
          const report = `# Pet Care feature extraction\n\n` +
            `The standalone Pet Care route now imports its care scene from \`client/src/features/pet-care/FeedingOverlay.tsx\` rather than importing \`PetHousePage.tsx\`.\n\n` +
            `## Production build verification\n\n` +
            `- Pet Care route chunk: ${format(route)}\n` +
            `- Pet Care feature chunk: ${format(feature)}\n` +
            `- Pet House route chunk: ${format(house)}\n\n` +
            `The exact hashed filenames may change between builds. The regression suite enforces the source-level dependency boundary.\n\n` +
            `## Behavior intentionally unchanged\n\n` +
            `- Pet Care visuals and responsive layout\n` +
            `- Drag-only edible and gift application\n` +
            `- Inventory stacking and consumption rules\n` +
            `- Pet stats, rewards, endpoints, and cache invalidation\n` +
            `- Safe-mode and iOS recovery behavior\n`;
          fs.writeFileSync('docs/PET_CARE_FEATURE_EXTRACTION.md', report);
          NODE

      - name: Commit verified extraction
        shell: bash
        run: |
          rm -f .github/workflows/pet-care-extraction-once.yml
          rm -f .github/workflows/pet-care-extraction-pr.yml
          rm -f script/extract-pet-care-feature.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: isolate Pet Care feature module"
          git push origin HEAD:refactor/pet-care-feature-module
