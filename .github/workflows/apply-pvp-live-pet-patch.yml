name: Apply PvP live pet patch

on:
  push:
    branches: [feat/pvp-live-pet-animation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pvp-live-pet-animation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch PvP battle source
        run: python .github/scripts/apply_pvp_live_pet_patch.py
      - name: Remove one-shot patch helpers
        run: rm .github/scripts/apply_pvp_live_pet_patch.py .github/workflows/apply-pvp-live-pet-patch.yml
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/PvpBattlePage.tsx .github/scripts/apply_pvp_live_pet_patch.py .github/workflows/apply-pvp-live-pet-patch.yml
          git commit -m "Animate live PvP battle pets with safe canvas renderer"
          git push origin HEAD:feat/pvp-live-pet-animation
