name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      purchase-postgres:
        image: postgres:16
        env:
          POSTGRES_USER: purchase_test
          POSTGRES_PASSWORD: purchase_test
          POSTGRES_DB: purchase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U purchase_test -d purchase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:tests
      - run: npm test
        env:
          PURCHASE_TEST_DATABASE_URL: postgres://purchase_test:purchase_test@localhost:5432/purchase_test
      - run: npm run build
