# Temporary branch runner; restored to the normal CI file by the patch job.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-clearing-polish:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/clearing-action-visual-polish'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clearing-action-visual-polish
          fetch-depth: 0
      - name: Apply scoped Clearing patch
        shell: bash
        run: |
          set +e
          node .github/scripts/apply-clearing-action-visual-polish.cjs > /tmp/clearing-patch.log 2>&1
          patch_status=$?
          set -e
          if [ "$patch_status" -ne 0 ]; then
            cp /tmp/clearing-patch.log clearing-patch-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add clearing-patch-failure.log
            git commit -m "Record Clearing patch failure"
            git push origin HEAD:fix/clearing-action-visual-polish
            exit "$patch_status"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx tsx --test test/elysianClearingActionVisualPolish.test.ts test/elysianClearingControls.test.ts test/elysianClearingRegressions.test.ts test/elysianClearingTargetLock.test.ts
      - run: npm test
      - run: npm run build
      - run: git diff --check
      - name: Commit tested Clearing polish
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                - run: npm ci
                - run: npm run check
                - run: npm test
                - run: npm run build
          EOF
          rm -f .github/workflows/apply-clearing-action-visual-polish.yml
          rm -f .github/scripts/apply-clearing-action-visual-polish.cjs
          rm -f clearing-patch-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/ElysianClearingCombat.tsx client/src/components/ClearingAttackEffect.tsx client/src/components/WalkAroundScene.tsx test/elysianClearingActionVisualPolish.test.ts .github/workflows/ci.yml .github/workflows/apply-clearing-action-visual-polish.yml .github/scripts/apply-clearing-action-visual-polish.cjs clearing-patch-failure.log
          git commit -m "Polish Elysian Clearing action visuals"
          git push origin HEAD:fix/clearing-action-visual-polish

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
