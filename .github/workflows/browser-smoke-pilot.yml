name: Tutorial and viewport browser checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/src/components/QuestGuideSpotlight.tsx'
      - 'client/src/components/LonelleQuestOverlay.tsx'
      - 'client/src/components/JansonQuestOverlay.tsx'
      - 'client/src/components/GinnyQuestOverlay.tsx'
      - 'client/src/components/PetCostumeEquipmentSection.tsx'
      - 'client/src/components/PetLevelUpPage.tsx'
      - 'client/src/pages/PetLevelUpRoute.tsx'
      - 'client/src/components/PetPark*.tsx'
      - 'client/src/pages/PetParkPage.tsx'
      - 'client/src/pages/WorldSceneEditorPage.tsx'
      - 'client/src/components/world-editor/**'
      - 'shared/worlds/worldScene*.ts'
      - 'server/routes/worldScene*.routes.ts'
      - 'server/routes/worldGarden*.routes.ts'
      - 'client/src/lib/petPark*.ts'
      - 'shared/petParkTerrainDetails.ts'
      - 'client/src/components/FloatingNav.tsx'
      - 'client/src/components/PetInventory.tsx'
      - 'client/src/pages/HomePage.tsx'
      - 'client/src/pages/PetInventoryPage.tsx'
      - 'client/src/pages/SellFishPage.tsx'
      - 'client/src/lib/queryClient.ts'
      - 'client/src/lib/questGuide*.ts'
      - 'client/src/lib/mainNavState.ts'
      - 'client/src/App.tsx'
      - 'client/src/index.css'
      - 'client/src/tabletStageShell.css'
      - 'script/*smoke.mjs'
      - '.github/workflows/browser-smoke-pilot.yml'

# Only the newest revision of each pull request needs runner time.
# Do not cancel completed/push builds on the protected main branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  public-route-smoke:
    # Playwright 1.56.1 does not support the Ubuntu 26.04 latest image.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install isolated browser runner (no lockfile or manifest changes)
        run: |
          npm install --prefix "$RUNNER_TEMP/para-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          ln -s "$RUNNER_TEMP/para-browser/node_modules/playwright" node_modules/playwright
          ln -s "$RUNNER_TEMP/para-browser/node_modules/playwright-core" node_modules/playwright-core
      # ubuntu-22.04 GitHub-hosted runners already provide Chromium's required
      # shared libraries. --with-deps runs apt anyway; slow Ubuntu font mirrors
      # have exhausted this 15-minute job after every smoke test passed.
      - run: node node_modules/playwright/cli.js install chromium
      - name: Exercise public route at phone, tablet and desktop sizes
        shell: bash
        run: |
          set -euo pipefail
          npx vite --host 127.0.0.1 --port 4173 --strictPort > /tmp/para-pets-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/privacy > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/para-pets-vite.log
            exit 1
          fi
          # 10/12: real Home actor, first-save, saved outfits, error and Back navigation.
          node script/home-avatar-cutover-smoke.mjs
          node script/browser-smoke.mjs
          node script/desktop-coming-soon-smoke.mjs
          node script/desktop-portrait-shell-smoke.mjs
          node script/level-up-game-layout-smoke.mjs
          node script/pet-park-placement-smoke.mjs
          node script/world-editor-smoke.mjs
          node script/pet-park-player-profile-smoke.mjs
          node script/pet-park-indoor-touch-smoke.mjs
          node script/pet-park-interior-dimming-smoke.mjs
          node script/pet-park-water-source-smoke.mjs
          node script/pet-park-garden-smoke.mjs
          node script/pet-park-shop-rotation-smoke.mjs
          node script/garden-stage-placement-smoke.mjs
          node script/pet-park-isometric-smoke.mjs
          # Independent story quests remain covered; the retired introduction tour is not run.
          node script/lonelle-quest-smoke.mjs
          node script/ginny-guide-smoke.mjs
          node script/onboarding-retirement-smoke.mjs
          node script/janson-quest-smoke.mjs
          # Real player-avatar UI against isolated, disposable account fixtures.
          node script/player-avatar-wardrobe-smoke.mjs
          # Stage 09 Home account HUD on small phones/tablets, using isolated player fixtures.
          node script/home-player-hud-smoke.mjs

